name: Robinhood Chain FINAL Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: robinhood-chain-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Check out private bot
        uses: actions/checkout@v4
        with:
          repository: yousefi52by-cyber/-rh-chain-alert-bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: bot
          ref: main

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
          restore-keys: |
            robinhood-chain-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Prepare configuration
        working-directory: bot
        run: |
          if [ ! -f config.json ]; then cp 01_config.example.json config.json; fi
          python -m json.tool config.json >/dev/null
          python -m py_compile 03_rh_chain_bot_v4.py

      - name: Run tests
        working-directory: bot
        run: |
          python 50_TESTS.py
          python 50_EARLY_DISCOVERY_TESTS.py
          python 51_TELEGRAM_NOISE_TESTS.py
          python 52_FINAL_COMPLETION_TESTS.py

      - name: Diagnose Telegram API
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          base = f"https://api.telegram.org/bot{token}"

          def call(method, **kwargs):
              try:
                  r = requests.get(f"{base}/{method}", timeout=10, **kwargs)
                  print(f"{method}: HTTP {r.status_code}")
                  data = r.json()
              except Exception as e:
                  print(f"{method}: request_error={type(e).__name__}")
                  return None
              print(f"{method}: ok={data.get('ok')} error_code={data.get('error_code')}")
              if data.get("description"):
                  print(f"{method}: description={data['description']}")
              return data

          call("getMe")
          wh = call("getWebhookInfo")
          if wh and wh.get("ok"):
              info = wh.get("result") or {}
              print(f"webhook_url_set={bool(info.get('url'))}")
              print(f"pending_update_count={info.get('pending_update_count', 0)}")
              print(f"webhook_last_error_present={bool(info.get('last_error_message'))}")
          call("getUpdates", params={
              "timeout": 1,
              "limit": 1,
              "allowed_updates": '["message","callback_query"]'
          })
          PY

      - name: Poll Telegram before scan
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("rhbot", "03_rh_chain_bot_v4.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          b = mod.Bot("config.json", "state.json")
          n = b.telegram_poll_once(max_updates=20)
          print(f"Telegram pre-scan updates processed: {n}")
          PY

      - name: Run scanner
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python 03_rh_chain_bot_v4.py --config config.json --state state.json --once

      - name: Keep Telegram responsive
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, time
          spec = importlib.util.spec_from_file_location("rhbot", "03_rh_chain_bot_v4.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          deadline = time.time() + 150
          total = 0
          while time.time() < deadline:
              b = mod.Bot("config.json", "state.json")
              n = b.telegram_poll_once(max_updates=20)
              total += n
              time.sleep(5)
          print(f"Telegram responsive window finished; updates processed: {total}")
          PY

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
