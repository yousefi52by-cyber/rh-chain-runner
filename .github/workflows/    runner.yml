name: Robinhood Chain Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: robinhood-chain-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Check out private bot
        uses: actions/checkout@v4
        with:
          repository: yousefi52by-cyber/-rh-chain-alert-bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: bot
          ref: main

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
          restore-keys: |
            robinhood-chain-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Prepare configuration
        working-directory: bot
        run: |
          if [ ! -f config.json ]; then cp 01_config.example.json config.json; fi
          python -m json.tool config.json >/dev/null
          python -m py_compile 03_rh_chain_bot_v4.py

      - name: Run tests
        working-directory: bot
        run: |
          python 50_TESTS.py
          python 50_EARLY_DISCOVERY_TESTS.py
          python 51_TELEGRAM_NOISE_TESTS.py
          python 52_FINAL_COMPLETION_TESTS.py

      - name: Audit current Demo state
        working-directory: bot
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('state.json')
          if not p.exists():
              print('DEMO_STATE: no state.json yet (fresh state)')
              raise SystemExit(0)
          try:
              s=json.loads(p.read_text())
              d=s.get('demo',{}) or {}
              today=s.get('today',{}) or {}
              pos=d.get('positions',{}) or {}
              trades=d.get('trades',[]) or []
              if isinstance(trades, dict):
                  trades=list(trades.values())
              print(f"DEMO_STATE: cash=${float(d.get('cash',0) or 0):.4f} realized_pnl=${float(d.get('realized_pnl',0) or 0):+.4f} open_positions={len(pos)} total_trades={len(trades)} today_trades={int(today.get('trades',0) or 0)} today_loss=${float(today.get('loss',0) or 0):+.4f}")
              for a,x in pos.items():
                  print(f"DEMO_POSITION: {x.get('name','TOKEN')} | chain={x.get('chain_id','')} | entry={x.get('entry')} | last={x.get('last_price')} | invested=${float(x.get('invested',0) or 0):.4f}")
              for x in trades[-10:]:
                  print(f"DEMO_TRADE: {x.get('name','TOKEN')} | side={x.get('side','')} | reason={x.get('reason','')} | pnl=${float(x.get('pnl',0) or 0):+.4f} | pnl_pct={float(x.get('pnl_pct',0) or 0):+.2f}%")
          except Exception as e:
              print(f"DEMO_AUDIT_WARNING: {type(e).__name__}: {e}")
          PY
          exit 0

      - name: Poll Telegram before scan
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('rhbot','03_rh_chain_bot_v4.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          b=mod.Bot('config.json','state.json')
          n=b.telegram_poll_once(max_updates=20)
          print(f'Telegram pre-scan updates processed: {n}')
          PY

      - name: Run scanner
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python 03_rh_chain_bot_v4.py --config config.json --state state.json --once

      - name: Keep Telegram responsive
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, time
          spec=importlib.util.spec_from_file_location('rhbot','03_rh_chain_bot_v4.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          deadline=time.time()+150; total=0
          while time.time()<deadline:
              b=mod.Bot('config.json','state.json')
              total += b.telegram_poll_once(max_updates=20)
              time.sleep(5)
          print(f'Telegram responsive window finished; updates processed: {total}')
          PY

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
