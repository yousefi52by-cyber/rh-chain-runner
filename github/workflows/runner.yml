name: Robinhood Chain Free Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: robinhood-chain-scanner
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out private bot
        uses: actions/checkout@v4
        with:
          repository: yousefi52by-cyber/-rh-chain-alert-bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: bot
          ref: main

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
          restore-keys: |
            robinhood-chain-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Prepare configuration
        working-directory: bot
        run: |
          if [ ! -f config.json ]; then cp 01_config.example.json config.json; fi
          python -m json.tool config.json >/dev/null
          python -m py_compile 03_rh_chain_bot_v4.py

      - name: Run tests
        working-directory: bot
        run: |
          python 50_TESTS.py
          python 50_EARLY_DISCOVERY_TESTS.py
          python 51_TELEGRAM_NOISE_TESTS.py

      - name: Run scanner
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python 03_rh_chain_bot_v4.py --config config.json --state state.json --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/state.json
          key: robinhood-chain-state-${{ github.run_id }}
